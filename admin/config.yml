
backend:
  name: github
  repo: keemshotit/Keem-shot-it-website
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

site_url: https://keemshotit.netlify.app
display_url: https://keemshotit.netlify.app

collections:
  - name: "portfolio"
    label: "Portfolio Photos"
    folder: "content/portfolio"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Lifestyle", "Portrait", "Culture"] }
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
